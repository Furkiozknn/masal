name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Bagimlilik yok: uygulama da testler de duz ESM, node:test ile kosuyor.
      # `npm ci` adimi bilerek yok - kuracak bir sey olmadigi icin eklenirse
      # her kosuda "no package-lock.json" ile duser.
      - name: Testler
        run: node --test

      # app.js ve karakter.js hicbir testin import etmedigi iki dosya:
      # testler onlara dokunmadigi icin bozuk bir sozdizimi yesil kosudan
      # gecebiliyordu. node --check hepsini ayri ayri ayristiriyor.
      - name: Sozdizimi denetimi
        run: |
          set -e
          for f in app.js karakter.js depo.js hikayeler.js olcum.js sahneler.js turkce.js; do
            node --check "$f"
          done
          echo "yedi modulun sozdizimi saglam"

  # Uygulama tek bir index.html ve yaninda birkac modul; build adimi yok.
  # Bu is, dosyalarin gercekten yuklenebildigini ve sayfanin bos gelmedigini
  # dogruluyor - test takimi saf mantigi sinar, sayfanin acildigini sinamaz.
  sayfa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sayfa yerelde aciliyor ve bos degil
        run: |
          set -e
          python3 -m http.server 8123 --bind 127.0.0.1 &
          sunucu=$!
          trap 'kill $sunucu' EXIT
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8123/index.html && break
            sleep 1
          done
          govde=$(curl -sf http://127.0.0.1:8123/index.html)
          test -n "$govde" || { echo "index.html bos dondu"; exit 1; }
          # Modullerin hepsi gercekten sunuluyor mu: birinin adi degisirse
          # sayfa sessizce yarim acilir, konsola bakan olmaz.
          for f in app.js hikayeler.js sahneler.js turkce.js karakter.js olcum.js; do
            curl -sf -o /dev/null "http://127.0.0.1:8123/$f" || { echo "eksik modul: $f"; exit 1; }
          done
          echo "sayfa ve alti modul sunuluyor"

  # "Indirme yok" bu urunun bir vaadi, suslemesi degil: cocugun cizimi
  # cihazdan cikmamali. Iki ayri kontrol, cunku iki ayri yol var.
  #
  # Ilk taslak tek bir grep'ti ve `fetch(` ile `sendBeacon`i da yakaliyordu -
  # yani olcum.js yuzunden her kosuda kirmizi yanardi. Ama vaat "hic ag
  # olmasin" degil: olcum.js anonim olcum yolluyor ve gizlilik suzgeci kendi
  # testleriyle kilitli (boyamaGorseli dahil kisisel alanlarin hepsi dusuyor).
  # Dogru kural: gorsel disari cikaran yol HIC olmamali, ag cagrisi ise
  # YALNIZCA olcum.js icinde olmali.
  indirme-yok:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cizimi dosyaya cevirip indiren bir yol yok
        run: |
          set -e
          if grep -nE 'download=|toDataURL|toBlob|createObjectURL|showSaveFilePicker' \
               index.html app.js hikayeler.js sahneler.js turkce.js karakter.js olcum.js; then
            echo
            echo "Yukaridaki satir cizimi bir dosyaya cevirip cihazdan cikarabilir."
            echo "Bilerek eklendiyse bu kontrolu guncelle; kazayla eklendiyse geri al."
            exit 1
          fi
          echo "gorseli disari cikaran yol yok"

      - name: Depoya yalnizca depo.js'ten erisiliyor
        run: |
          set -e
          # `localStorage` site verisini reddeden bir tarayicida null DONDURMUYOR,
          # firlatiyor - Safari gizli sekme, "tum cerezleri engelle". app.js dil
          # tercihini modul seviyesinde korumasiz okuyordu: o cagri firladiginda
          # betik ilk satirinda oluyor ve cocuga bos sayfa aciliyordu. Daha
          # kotusu, "masal olustur" dugmesi de korumasizdi; gizli sekmede cocuk
          # masalini hic alamiyordu.
          #
          # Dosyadaki cagrilarin bir kismi zaten try/catch icindeydi, bir kismi
          # degildi. Sorun tek satir degil tutarsizlikti, o yuzden duzeltme de
          # tek satir degil: butun erisim depo.js'ten geciyor ve bu kontrol
          # baska bir dosyaya korumasiz cagri geri eklenmesini engelliyor.
          if grep -n 'localStorage' index.html app.js hikayeler.js sahneler.js                turkce.js karakter.js olcum.js; then
            echo
            echo "depo.js disinda localStorage erisimi belirdi. Bunlar gizli"
            echo "sekmede firlatir ve sayfayi oldurur. depo.js'teki oku/yaz/sil/"
            echo "okuJSON/yazJSON fonksiyonlarini kullan."
            exit 1
          fi
          echo "depoya yalnizca depo.js'ten erisiliyor"

      # sw.js bilerek ustteki ag kapisinin DISINDA: bir servis iscisinin
      # `fetch`i yeni bir istek uretmez, sayfanin zaten yaptigi istegi gecirir,
      # ve o kapi dosyayi toptan reddederdi. Yerine daha dar bir kontrol:
      # sw.js'teki her fetch'in argumani sayfadan gelen istek nesnesi olmali,
      # ve onbellek listesi import grafigiyle birebir ortusmeli.
      - name: Servis iscisi
        run: node arac/sw-dogrula.mjs

      - name: Ag cagrisi yalnizca olcum.js icinde
        run: |
          set -e
          if grep -nE 'fetch\(|XMLHttpRequest|sendBeacon|new WebSocket|EventSource' \
               index.html app.js hikayeler.js sahneler.js turkce.js karakter.js; then
            echo
            echo "olcum.js disinda bir ag cagrisi belirdi. Gizlilik suzgeci yalnizca"
            echo "olcum.js'ten gecen veriyi temizliyor; baska bir dosyadan cikan istek"
            echo "o suzgecten gecmez."
            exit 1
          fi
          echo "ag cagrisi yalnizca olcum.js icinde"
