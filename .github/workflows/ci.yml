name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      # Bagimlilik yok: uygulama da testler de duz ESM, node:test ile kosuyor.
      # `npm ci` adimi bilerek yok - kuracak bir sey olmadigi icin eklenirse
      # her kosuda "no package-lock.json" ile duser.
      - name: Testler
        run: node --test

      # app.js ve karakter.js hicbir testin import etmedigi iki dosya:
      # testler onlara dokunmadigi icin bozuk bir sozdizimi yesil kosudan
      # gecebiliyordu. node --check hepsini ayri ayri ayristiriyor.
      # Liste elle yazilmiyor: elle yazilmis liste sw.js'i hic kapsamamisti ve
      # yeni bir modul eklenince yine sessizce disarida kalirdi.
      - name: Sozdizimi denetimi
        run: |
          set -e
          n=0
          for f in *.js arac/*.mjs; do
            node --check "$f"
            n=$((n+1))
          done
          echo "$n dosyanin sozdizimi saglam"

  # Uygulama tek bir index.html ve yaninda birkac modul; build adimi yok.
  # Bu is, dosyalarin gercekten yuklenebildigini ve sayfanin bos gelmedigini
  # dogruluyor - test takimi saf mantigi sinar, sayfanin acildigini sinamaz.
  sayfa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Sayfa yerelde aciliyor ve bos degil
        run: |
          set -e
          python3 -m http.server 8123 --bind 127.0.0.1 &
          sunucu=$!
          trap 'kill $sunucu' EXIT
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8123/index.html && break
            sleep 1
          done
          govde=$(curl -sf http://127.0.0.1:8123/index.html)
          test -n "$govde" || { echo "index.html bos dondu"; exit 1; }
          # Modullerin hepsi gercekten sunuluyor mu: birinin adi degisirse
          # sayfa sessizce yarim acilir, konsola bakan olmaz. Liste depodan
          # turetiliyor (elle yazilmis hali depo.js'i atliyordu).
          n=0
          for f in $(ls *.js | grep -v '\.test\.js$') manifest.webmanifest; do
            curl -sf -o /dev/null "http://127.0.0.1:8123/$f" || { echo "eksik dosya: $f"; exit 1; }
            n=$((n+1))
          done
          echo "sayfa ve $n dosya sunuluyor"

  # Erisilebilirlik, uygulamanin KULLANILDIGI ekranlarda olculur.
  #
  # README "Lighthouse mobil: erisilebilirlik ... 100" diyordu ve bu
  # dogruydu -- Lighthouse'un olctugu ekranda. Lighthouse sayfayi acar ve
  # acildigi haliyle denetler; acilan ekran FORM. Cocugun masali okudugu
  # ekran hic denetlenmemisti, ve denetlenince iki WCAG AA ihlali cikti:
  # biri figcaption, digeri cocugun KENDI ADI (.metin b, kagit uzerinde
  # 4.37:1). index.html'in o satirindaki yorum zaten "kagit uzerinde
  # 4.37:1" yaziyordu - olculmus, yazilmis, oyle birakilmis.
  #
  # Bu is, form + okuyucu + boyanmis sayfa + secim ekrani + son sayfa +
  # kitaplik'i tek tek denetliyor. axe-core ve playwright bu deponun
  # bagimliligi degil (masal'in hic bagimliligi yok, package-lock.json da
  # yok); ekran-yakala.mjs ile ayni sekilde anlik kuruluyorlar.
  erisim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: axe-core ve tarayici
        run: |
          set -e
          npm install --no-save --no-package-lock axe-core playwright-core
          # Tarayici, az once kurulan playwright-core'un KENDI CLI'siyla:
          # `npx playwright@1` ayri cozulen bir surumdu ve farkli bir tarayici
          # yapisi indirebiliyordu (makinede baska bir playwright varsa o).
          npx playwright-core install --with-deps chromium

      - name: WCAG 2.1 AA, her ekranda
        run: node arac/erisim-denetle.mjs

  # Uygulamayi gercek bir tarayicida KULLANIR: iki ekran genisliginde tam akis
  # (konsol hatasi ve yatay tasma kirmizi), "Temizle"nin geri alinabilmesi ve
  # yeni bir dagitimin sayfayi onceden acmis kullaniciya ulasmasi (servis
  # iscisi). Son kontrol, ilk sw.js'in herkesi eski surumde tuttugu hatayi
  # yakaliyor; ayrintisi betigin basinda.
  tarayici:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Tarayici
        run: |
          set -e
          npm install --no-save --no-package-lock playwright-core
          npx playwright-core install --with-deps chromium

      - name: Akis, temizle/geri al, dagitim ve cevrimdisi
        run: node arac/tarayici-dogrula.mjs

  # "Indirme yok" bu urunun bir vaadi, suslemesi degil: cocugun cizimi
  # cihazdan cikmamali. Iki ayri kontrol, cunku iki ayri yol var.
  #
  # Ilk taslak tek bir grep'ti ve `fetch(` ile `sendBeacon`i da yakaliyordu -
  # yani olcum.js yuzunden her kosuda kirmizi yanardi. Ama vaat "hic ag
  # olmasin" degil: olcum.js anonim olcum yolluyor ve gizlilik suzgeci kendi
  # testleriyle kilitli (boyamaGorseli dahil kisisel alanlarin hepsi dusuyor).
  # Dogru kural: gorsel disari cikaran yol HIC olmamali, ag cagrisi ise
  # YALNIZCA olcum.js icinde olmali.
  indirme-yok:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cizimi dosyaya cevirip indiren bir yol yok
        run: |
          set -e
          # Uygulamanin butun dosyalari (testler haric). Elle yazilmis liste
          # depo.js ve sw.js'i atliyordu; yeni bir modul de atlanirdi.
          dosyalar="index.html $(ls *.js | grep -v '\.test\.js$')"
          if grep -nE 'download=|toDataURL|toBlob|createObjectURL|showSaveFilePicker' $dosyalar; then
            echo
            echo "Yukaridaki satir cizimi bir dosyaya cevirip cihazdan cikarabilir."
            echo "Bilerek eklendiyse bu kontrolu guncelle; kazayla eklendiyse geri al."
            exit 1
          fi
          echo "gorseli disari cikaran yol yok"

      - name: Depoya yalnizca depo.js'ten erisiliyor
        run: |
          set -e
          # `localStorage` site verisini reddeden bir tarayicida null DONDURMUYOR,
          # firlatiyor - Safari gizli sekme, "tum cerezleri engelle". app.js dil
          # tercihini modul seviyesinde korumasiz okuyordu: o cagri firladiginda
          # betik ilk satirinda oluyor ve cocuga bos sayfa aciliyordu. Daha
          # kotusu, "masal olustur" dugmesi de korumasizdi; gizli sekmede cocuk
          # masalini hic alamiyordu.
          #
          # Dosyadaki cagrilarin bir kismi zaten try/catch icindeydi, bir kismi
          # degildi. Sorun tek satir degil tutarsizlikti, o yuzden duzeltme de
          # tek satir degil: butun erisim depo.js'ten geciyor ve bu kontrol
          # baska bir dosyaya korumasiz cagri geri eklenmesini engelliyor.
          dosyalar="index.html $(ls *.js | grep -v -e '\.test\.js$' -e '^depo\.js$')"
          if grep -n 'localStorage' $dosyalar; then
            echo
            echo "depo.js disinda localStorage erisimi belirdi. Bunlar gizli"
            echo "sekmede firlatir ve sayfayi oldurur. depo.js'teki oku/yaz/sil/"
            echo "okuJSON/yazJSON fonksiyonlarini kullan."
            exit 1
          fi
          echo "depoya yalnizca depo.js'ten erisiliyor"

      # sw.js bilerek ustteki ag kapisinin DISINDA: bir servis iscisinin
      # `fetch`i yeni bir istek uretmez, sayfanin zaten yaptigi istegi gecirir,
      # ve o kapi dosyayi toptan reddederdi. Yerine daha dar bir kontrol:
      # sw.js'teki her fetch'in argumani sayfadan gelen istek nesnesi olmali,
      # ve onbellek listesi import grafigiyle birebir ortusmeli.
      - name: Servis iscisi
        run: node arac/sw-dogrula.mjs

      - name: Ag cagrisi yalnizca olcum.js icinde
        run: |
          set -e
          # olcum.js (suzgecli olcum) ve sw.js (yalniz event.request'i gecirir,
          # ustteki "Servis iscisi" adimi denetliyor) bilerek disarida.
          dosyalar="index.html $(ls *.js | grep -v -e '\.test\.js$' -e '^olcum\.js$' -e '^sw\.js$')"
          if grep -nE 'fetch\(|XMLHttpRequest|sendBeacon|new WebSocket|EventSource' $dosyalar; then
            echo
            echo "olcum.js disinda bir ag cagrisi belirdi. Gizlilik suzgeci yalnizca"
            echo "olcum.js'ten gecen veriyi temizliyor; baska bir dosyadan cikan istek"
            echo "o suzgecten gecmez."
            exit 1
          fi
          echo "ag cagrisi yalnizca olcum.js icinde"
