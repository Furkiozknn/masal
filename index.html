<style>
  :root{
    --kagit:#fdfaf3; --murekkep:#2c2a26;
    /* --vurgu, kagit (#fdfaf3) zemininde METIN olarak kullaniliyor: cocugun
       adi her sayfada bu renkle kalin yaziliyor (.metin b). Onceki deger
       #c0562f idi ve bu satirin kendisi "kagit uzerinde 4.37:1" yaziyordu --
       yani AA'nin 4.5 esigini gecmedigi olculmus, yazilmis ve oyle
       birakilmisti. Sayfadaki en cok okunan kelime.
       #b5512c: kagit 4.82:1, beyaz 5.03:1, ve dugme zemini olarak beyaz
       metin altinda 5.03:1. arac/erisim-denetle.mjs her push'ta olcuyor. */
    --vurgu:#b5512c; --kenar:#e6ded0;
    --soluk:#7a7268; --golge:0 2px 14px rgba(0,0,0,.09);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; background:#f0ebe1; color:var(--murekkep);
       font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
       min-height:100vh; display:flex; flex-direction:column}
  [hidden]{display:none!important}

  header{padding:.7rem 1rem; background:var(--kagit); border-bottom:1px solid var(--kenar);
         display:flex; align-items:center; gap:.8rem; flex-wrap:wrap}
  header h1{font-size:1rem; margin:0; font-weight:600}
  .kucuk{font-size:.78rem; color:var(--soluk)}
  select#dilSec{margin-left:auto; font-size:.8rem; padding:.25rem .4rem;
                border:1px solid var(--kenar); border-radius:7px; background:#fff; color:inherit}

  main{flex:1; display:flex; justify-content:center; padding:1rem}
  .kart{background:var(--kagit); max-width:720px; width:100%; border-radius:16px;
        box-shadow:var(--golge); padding:1.7rem 1.8rem 1.3rem;
        display:flex; flex-direction:column; gap:1rem}

  /* --- form --- */
  .kart h2{margin:0; font-size:1.45rem; font-family:Georgia,serif; font-weight:normal}
  .kart p.aciklama{margin:0; color:var(--soluk); font-size:.92rem; line-height:1.55}
  .alanlar{display:grid; grid-template-columns:1fr 1fr; gap:.9rem}
  label{display:flex; flex-direction:column; gap:.3rem; font-size:.82rem; color:var(--soluk)}
  input,select{padding:.6rem .7rem; border:1px solid var(--kenar); border-radius:9px;
               font-size:1rem; font-family:inherit; background:#fff; color:var(--murekkep)}
  input:focus,select:focus{outline:2px solid var(--vurgu); outline-offset:1px}
  .genis{grid-column:1 / -1}
  .dugme{padding:.75rem 1.3rem; border:0; border-radius:11px; background:var(--vurgu);
         color:#fff; font-size:1rem; font-weight:600; cursor:pointer; font-family:inherit}
  .dugme:hover{filter:brightness(1.06)}
  .dugme.sade{background:#fff; color:var(--murekkep); border:1px solid var(--kenar); font-weight:500}
  .dugme:disabled{opacity:.4; cursor:default; filter:none}
  .hata{color:#b3402f; font-size:.85rem; min-height:1.1em}

  /* --- kahramanin gorunumu --- */
  .gorunum{border:1px solid var(--kenar); border-radius:11px; padding:.7rem .8rem;
           display:flex; gap:.9rem; align-items:center; background:#fff}
  .gorunum-secimler{flex:1; display:flex; flex-direction:column; gap:.45rem; min-width:0}
  .gorunum-baslik{font-size:.82rem; color:var(--soluk)}
  .gorunum-satir{display:flex; gap:.35rem; flex-wrap:wrap}
  .gorunum-nokta{width:27px; height:27px; border-radius:50%; border:2px solid #fff;
                 box-shadow:0 0 0 1px var(--kenar); cursor:pointer; padding:0}
  .gorunum-nokta[aria-pressed="true"]{box-shadow:0 0 0 3px var(--murekkep); transform:scale(1.1)}
  .sac-tipi{padding:.3rem .65rem; font-size:.76rem; border:1px solid var(--kenar);
            background:#fff; border-radius:7px; cursor:pointer; font-family:inherit; color:inherit}
  .sac-tipi[aria-pressed="true"]{background:var(--murekkep); color:#fff; border-color:var(--murekkep)}
  .onizleme{width:66px; height:auto; flex:none}
  .onizleme .kisisel{stroke:var(--murekkep); stroke-width:2.5; stroke-linejoin:round}
  .onizleme .b{fill:#fff; stroke:var(--murekkep); stroke-width:2.5; stroke-linejoin:round}
  .onizleme .goz{fill:var(--murekkep); stroke:none}
  .onizleme .agiz{fill:none; stroke:var(--murekkep); stroke-width:2; stroke-linecap:round}

  /* --- okuyucu --- */
  /* Punto yasa gore ayarlaniyor (app.js): kucuk cocuk harfleri daha kolay takip etsin. */
  .metin{font-size:var(--metin-boy,1.15rem); line-height:1.8; font-family:Georgia,serif; margin:0}
  .metin b{color:var(--vurgu); font-weight:600}
  figure.boyama{margin:0; border:2px dashed var(--kenar); border-radius:13px;
                padding:.55rem; background:#fff}
  /* 12px gri metin: #8a8178 beyaz uzerinde 3.82:1 idi. Bu satir sahnenin
     erisilebilir adi (svg aria-labelledby ile buna bakiyor), yani ekran
     okuyucunun ve gozun ayni anda kullandigi tek ipucu. #7a726a: 4.73:1. */
  figure.boyama figcaption{font-size:.75rem; color:#7a726a; text-align:center; margin-bottom:.35rem}
  svg.sahne{display:block; width:100%; height:auto; touch-action:manipulation}
  svg.sahne .b{fill:#fff; stroke:var(--murekkep); stroke-width:2.5; stroke-linejoin:round;
               cursor:pointer; transition:fill .12s}
  svg.sahne .b:hover{fill:#f4efe4}
  svg.sahne .c{fill:none; stroke:var(--murekkep); stroke-width:2.5;
               stroke-linecap:round; pointer-events:none}
  /* sahne sadece resim olarak gosteriliyorsa (boyanamaz sayfa) */
  svg.sahne.donuk .b{cursor:default} svg.sahne.donuk .b:hover{fill:#fff}

  /* Kahraman. Ten ve sac rengi kisisellestirmeden geliyor ve fill ozniteligiyle
     yaziliyor; bu yuzden .c sinifi kullanilamaz (o fill:none dayatiyor). */
  svg.sahne .kisisel{stroke:var(--murekkep); stroke-width:2.5;
                     stroke-linejoin:round; pointer-events:none}
  svg.sahne .goz{fill:var(--murekkep); stroke:none; pointer-events:none}
  svg.sahne .agiz{fill:none; stroke:var(--murekkep); stroke-width:2;
                  stroke-linecap:round; pointer-events:none}

  .palet{display:flex; gap:.45rem; flex-wrap:wrap; align-items:center;
         justify-content:center; margin-top:.55rem}
  .renk{width:32px; height:32px; border-radius:50%; border:2px solid #fff;
        box-shadow:0 0 0 1px var(--kenar); cursor:pointer; padding:0}
  .renk[aria-pressed="true"]{box-shadow:0 0 0 3px var(--murekkep); transform:scale(1.12)}
  .arac{padding:.32rem .7rem; border:1px solid var(--kenar); background:#fff;
        border-radius:8px; font-size:.78rem; cursor:pointer; font-family:inherit; color:inherit}
  .durum{font-size:.75rem; color:var(--soluk); text-align:center; min-height:1.1em}
  .sesli{font-size:.85rem; padding:.4rem .9rem}
  .sesli[aria-pressed="true"]{background:var(--vurgu); color:#fff; border-color:var(--vurgu)}

  /* --- kitaplik --- */
  #kitaplikBolum{border-top:1px solid var(--kenar); padding-top:1.1rem}
  #kitaplikBaslik{margin:0 0 .7rem; font-size:.95rem; color:var(--soluk)}
  .kitaplik{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.5rem}
  .kitaplik li{display:flex; align-items:center; gap:.6rem; background:#fff;
               border:1px solid var(--kenar); border-radius:11px; padding:.55rem .7rem}
  .kitap-ac{flex:1; min-width:0; text-align:left; border:0; background:none;
            cursor:pointer; font-family:inherit; color:inherit; padding:.1rem}
  .kitap-ad{font-family:Georgia,serif; font-size:.98rem;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .kitap-alt{font-size:.74rem; color:var(--soluk); margin-top:.15rem}
  .kitap-ilerleme{height:4px; background:var(--kenar); border-radius:2px;
                  margin-top:.45rem; overflow:hidden}
  .kitap-ilerleme i{display:block; height:100%; background:var(--vurgu)}
  .kitap-sil{border:1px solid var(--kenar); background:#fff; color:var(--soluk);
             font-size:.74rem; cursor:pointer; padding:.35rem .6rem; border-radius:8px;
             font-family:inherit}

  /* --- secim noktasi --- */
  .secim{border:2px dashed var(--kenar); border-radius:13px; padding:.9rem; background:#fff}
  .secim-soru{margin:0 0 .7rem; text-align:center; font-size:.9rem; color:var(--soluk)}
  .secim-dugmeler{display:flex; gap:.6rem; flex-wrap:wrap; justify-content:center}
  .secim-dugmeler .dugme{flex:1 1 190px; font-size:.92rem}
  .secim-dugmeler .dugme[aria-pressed="true"]{background:var(--vurgu); color:#fff;
                                              border-color:var(--vurgu); font-weight:600}

  /* --- sahnedeki hafif hareket ---
     Yalnizca dekoratif ogeler (.c) kipirdar; boyanabilir bolgeler sabit kalir,
     cocuk boyarken altindaki sekil oynamasin. Uyku oncesi icin bilerek yavas. */
  @keyframes kar-dus{
    0%   {transform:translateY(-14px); opacity:0}
    12%  {opacity:1}
    88%  {opacity:1}
    100% {transform:translateY(140px); opacity:0}
  }
  @keyframes parilti{ 0%,100%{opacity:1} 50%{opacity:.3} }
  @keyframes dalga-kay{ 0%,100%{transform:translateX(0)} 50%{transform:translateX(7px)} }

  svg.sahne .kar-tanesi  {animation:kar-dus 11s linear infinite var(--gecikme,0s)}
  svg.sahne .dusen-yaprak{animation:kar-dus 15s linear infinite var(--gecikme,0s)}
  svg.sahne .parilti     {animation:parilti 3.4s ease-in-out infinite var(--gecikme,0s)}
  svg.sahne .dalga       {animation:dalga-kay 5.5s ease-in-out infinite var(--gecikme,0s)}

  /* Resim tamamlaninca sahne canlanir: hareket odul olarak geliyor. Cocuk
     boyarken sekiller sabit duruyor, bitirince kimildamaya basliyorlar. */
  @keyframes suzul{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
  @keyframes salla{ 0%,100%{transform:rotate(0)} 50%{transform:rotate(5deg)} }
  svg.sahne.canli .canlanir-suzul{animation:suzul 3s ease-in-out infinite}
  svg.sahne.canli .canlanir-salla{animation:salla 2.4s ease-in-out infinite;
                                  transform-box:fill-box; transform-origin:center}

  /* Sayfa gecisi: metin ve resim yumusak girsin */

  @media (prefers-reduced-motion:reduce){
    svg.sahne .kar-tanesi, svg.sahne .dusen-yaprak,
    svg.sahne .parilti, svg.sahne .dalga,
    svg.sahne.canli .canlanir-suzul, svg.sahne.canli .canlanir-salla,
    .sayfa-gecis{animation:none}
  }

  /* --- bitince tema onerisi --- */
  .oneri{border-top:1px solid var(--kenar); padding-top:1rem; text-align:center}
  .oneri-baslik{margin:0 0 .6rem; font-size:.85rem; color:var(--soluk)}
  .oneri-dugmeler{display:flex; gap:.5rem; flex-wrap:wrap; justify-content:center}
  .oneri-dugmeler .dugme{font-size:.88rem; padding:.5rem 1rem}

  /* --- boyama bitince kutlama --- */
  .kutlama{text-align:center; font-size:.88rem; font-weight:600; color:var(--vurgu);
           animation:belir .45s ease}
  @keyframes belir{from{opacity:0; transform:translateY(7px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion:reduce){ .kutlama{animation:none} }

  .gezinti{display:flex; align-items:center; gap:.6rem; justify-content:space-between}
  .gezinti .orta{font-size:.8rem; color:var(--soluk)}
  .noktalar{display:flex; gap:.3rem; justify-content:center}
  .nokta{width:7px; height:7px; border-radius:50%; background:var(--kenar)}
  .nokta.aktif{background:var(--vurgu)}

  @media (max-width:520px){
    .kart{padding:1.2rem 1.1rem}
    .alanlar{grid-template-columns:1fr}
    .metin{font-size:calc(var(--metin-boy,1.15rem) * .92)}
    /* Boyama alanini kenardan kenara ac: kucuk parmaklar icin her bolge
       ~%20 buyur, en kucuk dokunma hedefi 24px esiginin uzerine cikar. */
    figure.boyama{margin-left:-1.1rem; margin-right:-1.1rem;
                  border-left:0; border-right:0; border-radius:0}
  }
  /* ================= YENILEME (29.09.2026) =================
     Urunun kimligi (sicak kagit, Georgia, terracotta) aynen duruyor. Eklenenler:
     dokunma hedefleri >= 44px, odak halkasi, boyama geri bildirimi, sayfa
     itmesi, masal sonu ekrani. Video sisteminden (sosyal/uret) alinanlar:
     sahne.js `iris` (dairesel acilis, 0.45 sn) ve `yatay`/`itme` (yumusak itme,
     expo cikis); tema.mjs "kagit" temasinin sakin renk akisi (#ffd9cf #fff0b3
     #d9f2dc #d6e4ff). glitch/flas/blok gibi sert gecisler bilerek alinmadi. */
  :focus-visible{outline:3px solid #1f45c9; outline-offset:2px}
  .atla{position:absolute; left:.6rem; top:-4rem; background:var(--murekkep); color:#fff;
        min-height:44px; display:inline-flex; align-items:center; padding:.4rem 1rem; border-radius:9px; z-index:10; text-decoration:none; font-size:.9rem}
  .atla:focus{top:.6rem}
  main:focus,h2[tabindex]:focus{outline:none}
  .dugme,.renk,.arac,.sac-tipi,.gorunum-nokta,.kitap-sil{transition:transform .12s ease, filter .12s ease}
  .dugme:active,.renk:active,.arac:active,.sac-tipi:active,.gorunum-nokta:active{transform:scale(.95)}
  .dugme{min-height:48px}
  .dugme.buyuk{width:100%; min-height:58px; font-size:1.15rem; border-radius:14px;
               box-shadow:0 3px 0 #8f3f1f}
  .dugme.buyuk:active{box-shadow:0 1px 0 #8f3f1f; transform:translateY(2px)}
  select#dilSec{min-height:44px; padding:.4rem .6rem}
  input,select{min-height:48px}

  .guven{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:.4rem}
  .guven li{font-size:.78rem; color:#5f574d; background:#f4efe4; border-radius:999px; padding:.3rem .75rem}
  details.ozel{border:1px solid var(--kenar); border-radius:12px; background:#fff}
  details.ozel summary{display:flex; align-items:center; gap:.7rem; cursor:pointer; min-height:56px;
                       padding:.4rem .8rem; list-style:none; font-size:.92rem}
  details.ozel summary::-webkit-details-marker{display:none}
  details.ozel summary::after{content:"+"; margin-left:auto; font-size:1.4rem; color:var(--soluk); line-height:1}
  details.ozel[open] summary::after{content:"\2212"}
  details.ozel summary .onizleme{width:34px; order:-1}
  details.ozel .gorunum{border:0; border-top:1px solid var(--kenar); border-radius:0 0 12px 12px}

  /* 27px/32px yuvarlaklar cocuk parmagi icin kucuktu: gorunen nokta ayni,
     dokunma alani 44px. Halka noktanin hemen etrafinda (outline-offset negatif). */
  .gorunum-nokta{width:44px; height:44px; padding:8px; background-clip:content-box; border:0;
                 box-shadow:none; margin:-4px; outline:1px solid var(--soluk); outline-offset:-8px}
  .gorunum-nokta[aria-pressed="true"]{box-shadow:none; transform:none;
                 outline:3px solid var(--murekkep); outline-offset:-6px}
  .sac-tipi{min-height:44px; padding:.4rem .9rem}
  .renk{width:44px; height:44px}
  .arac{min-height:44px; padding:.4rem .9rem; font-size:.85rem}
  .kitap-sil{min-height:44px}
  .gezinti .dugme{white-space:nowrap; padding:.75rem 1rem}

  /* boyama: dokunulan bolge kisa bir "pop" yapar, ilerleme cubugu dolar */
  svg.sahne .b.pop{animation:pop .24s ease-out; transform-box:fill-box; transform-origin:center}
  @keyframes pop{0%{transform:scale(.97)} 55%{transform:scale(1.035)} 100%{transform:scale(1)}}
  .ilerleme{height:10px; background:var(--kenar); border-radius:6px; overflow:hidden; margin:.7rem .2rem .1rem}
  .ilerleme i{display:block; height:100%; width:0; background:var(--vurgu); border-radius:6px;
              transition:width .3s ease}
  figure.boyama.bitti .ilerleme i{background:linear-gradient(90deg,#e8574a,#f2a03d,#f5d547,#5aa469,#3d7ea6,#8e6bbf)}
  /* resim bitince kagit renk akisi: cerceve sirayla mercan, sari, yesil, mavi yanip soner */
  figure.boyama.bitti{animation:odul 1.6s ease-out}
  @keyframes odul{
    0%{box-shadow:0 0 0 0 #ffd9cf}
    25%{box-shadow:0 0 0 9px #fff0b3}
    50%{box-shadow:0 0 0 12px #d9f2dc}
    75%{box-shadow:0 0 0 9px #d6e4ff}
    100%{box-shadow:0 0 0 0 rgba(214,228,255,0)}
  }

  /* sayfa cevirme: iris'in yumusak kardesi, yatay itme + belirme (yon --kay ile) */
  @keyframes sayfa-gir{
    from{opacity:0; transform:translate(var(--kay,0px),10px)}
    to{opacity:1; transform:none}
  }
  .sayfa-gecis{animation:sayfa-gir .4s cubic-bezier(.16,1,.3,1)}
  /* itme sirasinda icerik kartin disina tasmasin: yatay kaydirma cubugu cikmasin */
  .kart{overflow-x:clip}

  /* masal sonu: ay ve yildizlar, dairesel acilis (sahne.js iris) */
  .son-kart{display:flex; align-items:center; gap:1rem; padding:1rem 1.1rem; border-radius:16px;
            background:linear-gradient(135deg,#d6e4ff 0%,#fff0b3 100%);
            animation:iris-ac .9s cubic-bezier(.45,0,.2,1) backwards}
  @keyframes iris-ac{from{clip-path:circle(0% at 15% 50%)} to{clip-path:circle(150% at 15% 50%)}}
  .son-ay{width:78px; height:78px; flex:none}
  .son-ay .yildiz{animation:parilti 3s ease-in-out infinite var(--gecikme,0s)}
  .son-yazi{flex:1; min-width:0}
  .son-yazi h3{margin:0; font-family:Georgia,serif; font-weight:normal; font-size:1.3rem; color:var(--murekkep)}
  .son-yazi p{margin:.25rem 0 .7rem; font-size:.88rem; color:#4a453e; line-height:1.5}
  .son-yazi .dugme{min-height:44px; padding:.5rem 1.1rem; font-size:.92rem}

  footer.alt{background:#0e0d0b; color:#f1ece2; text-align:center; font-size:.78rem; padding:.9rem 1rem;
             font-family:ui-monospace,Consolas,"Courier New",monospace; letter-spacing:.02em}
  footer.alt a{color:#ffc21a; text-underline-offset:3px}

  @media (max-width:520px){
    .son-kart{flex-direction:column; text-align:center}
    .gezinti{gap:.4rem}
    .gezinti .orta{font-size:.74rem; text-align:center}
  }
  @media (prefers-reduced-motion:reduce){
    .dugme,.renk,.arac,.sac-tipi,.gorunum-nokta{transition:none}
    .dugme:active,.renk:active,.arac:active,.sac-tipi:active,.gorunum-nokta:active{transform:none}
    svg.sahne .b.pop, figure.boyama.bitti, .son-kart, .son-ay .yildiz, .sayfa-gecis{animation:none}
    .ilerleme i{transition:none}
  }
</style>
</head>
<body>

<a class="atla" id="atla" href="#ana">Ana içeriğe geç</a>
<header>
  <h1 id="ustBaslik">Masal</h1>
  <span class="kucuk" id="ustBilgi"></span>
  <select id="dilSec" aria-label="Dil"></select>
</header>

<main id="ana" tabindex="-1">
  <!-- 1. ekran: form. Metinler Turkce statik yazili: JS yuklenene kadar sayfa
       bos gorunmesin (duzen kaymasi) ve arama motoru JS calistirmadan icerik gorsun.
       app.js acilista secili dile gore hepsini yeniden yaziyor. -->
  <section class="kart" id="formEkran">
    <h2 id="fBaslik" tabindex="-1">Çocuğunuza özel masal</h2>
    <p class="aciklama" id="fAciklama">Adını, yaşını ve şehrini yaz. Masal ona göre yazılsın.</p>
    <ul class="guven" id="guven"><li>Kayıt yok</li><li>İndirme yok</li><li>Veri cihazdan çıkmaz</li></ul>
    <form class="alanlar" id="form">
      <label class="genis">
        <span id="lAd">Çocuğun adı</span>
        <input id="ad" name="ad" required maxlength="24" autocomplete="off">
      </label>
      <label>
        <span id="lYas">Yaşı</span>
        <select id="yas"></select>
      </label>
      <label>
        <span id="lSehir">Şehri</span>
        <input id="sehir" name="sehir" maxlength="32" autocomplete="off">
      </label>
      <label class="genis">
        <span id="lTema">Konu</span>
        <select id="tema"></select>
      </label>
      <!-- Kahramanin gorunumu. Fotograf istenmiyor: secim elle yapiliyor,
           hicbir gorsel cihazdan cikmiyor. -->
      <details class="genis ozel">
        <summary>
          <svg class="onizleme" id="kahramanOnizleme" viewBox="-32 -92 64 98" aria-hidden="true"></svg>
          <span><span id="gorunumBaslik">Kahramanı özelleştir</span>
            <span class="kucuk" id="gorunumIstege">isteğe bağlı</span></span>
        </summary>
        <div class="gorunum">
          <div class="gorunum-secimler">
            <div class="gorunum-satir" id="tenSecim" role="group" aria-label="ten rengi"></div>
            <div class="gorunum-satir" id="sacSecim" role="group" aria-label="saç rengi"></div>
            <div class="gorunum-satir" id="sacTipiSecim" role="group" aria-label="saç"></div>
          </div>
        </div>
      </details>

      <div class="genis hata" id="hata"></div>
      <div class="genis"><button class="dugme buyuk" id="olustur" type="submit">Masalı oluştur</button></div>
    </form>

    <!-- Kitaplik: okunan masallar birikir, kaldigi sayfadan devam edilir.
         Bos oldugunda bolum hic gorunmez. -->
    <section id="kitaplikBolum" hidden>
      <h3 id="kitaplikBaslik">Kitaplık</h3>
      <ul class="kitaplik" id="kitaplik"></ul>
    </section>
  </section>

  <!-- 2. ekran: okuyucu -->
  <section class="kart" id="okuyucuEkran" hidden>
    <h2 id="hBaslik" tabindex="-1"></h2>
    <p class="metin" id="hMetin" aria-live="polite"></p>
    <!-- Sesli okuma: tarayicinin kendi konusma motoru. O dilde ses yuklu degilse
         (ornegin Turkce sesi olmayan bir Windows) dugme hic gorunmez. -->
    <div><button class="dugme sade sesli" id="sesli" type="button" hidden></button></div>

    <!-- Masal sonu: iyi geceler karti. Yalnizca son sayfada gorunur. -->
    <div class="son-kart" id="sonKart" hidden>
      <svg class="son-ay" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M62 14a38 38 0 1 0 24 62 31 31 0 0 1-24-62z" fill="#f2c94c" stroke="#2c2a26" stroke-width="3" stroke-linejoin="round"/>
        <path class="yildiz" style="--gecikme:0s" d="M78 20l2.6 6.4 6.4 2.6-6.4 2.6L78 38l-2.6-6.4-6.4-2.6 6.4-2.6z" fill="#fff" stroke="#2c2a26" stroke-width="2" stroke-linejoin="round"/>
        <path class="yildiz" style="--gecikme:1.1s" d="M86 52l1.7 4.3 4.3 1.7-4.3 1.7L86 64l-1.7-4.3-4.3-1.7 4.3-1.7z" fill="#fff" stroke="#2c2a26" stroke-width="2" stroke-linejoin="round"/>
      </svg>
      <div class="son-yazi">
        <h3 id="sonBaslik"></h3>
        <p id="sonAlt"></p>
        <button class="dugme sade" id="bastan" type="button">Baştan oku</button>
      </div>
    </div>

    <!-- Secim noktasi: cocuk hikayeyi yonlendirir. Secilmeden ileri gidilemez. -->
    <div class="secim" id="secim" hidden>
      <p class="secim-soru" id="secimSoru"></p>
      <div class="secim-dugmeler">
        <button class="dugme sade" id="secimA" type="button"></button>
        <button class="dugme sade" id="secimB" type="button"></button>
      </div>
    </div>

    <figure class="boyama" id="boyamaKutu" hidden>
      <figcaption id="boyaIpucu"></figcaption>
      <svg class="sahne" id="sahne" viewBox="0 0 400 260" role="img" aria-labelledby="boyaIpucu"></svg>
      <div class="palet" id="palet"></div>
      <div class="ilerleme" id="ilerleme" role="progressbar" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0"><i></i></div>
      <div class="durum" id="durum" role="status"></div>
    </figure>

    <div class="noktalar" id="noktalar"></div>
    <div class="gezinti">
      <button class="dugme sade" id="geri"></button>
      <span class="orta" id="sayfaBilgi"></span>
      <button class="dugme" id="ileri"></button>
    </div>
    <!-- Masal bitince: ayni cocuk icin okunmamis temalar. Kapanista yapacak
         bir sey olsun, uygulamadan cikilmasin. -->
    <div class="oneri" id="oneri" hidden>
      <p class="oneri-baslik" id="oneriBaslik"></p>
      <div class="oneri-dugmeler" id="oneriDugmeler"></div>
    </div>

    <div style="text-align:center"><button class="dugme sade" id="yeniden"></button></div>
  </section>
</main>

<footer class="alt"><a href="https://github.com/Furkiozknn" rel="noopener noreferrer">FRK-OS</a> <span id="altYazi">yapımı</span></footer>

<script type="module" src="./app.js"></script>
<script>
// Cevrimdisi calisma. Bu bir ag cagrisi degil: servis iscisini kaydediyor,
// hicbir yere istek gondermiyor. Islerin ne yaptigi sw.js'te yazili ve
// `arac/sw-dogrula.mjs` her push'ta onu denetliyor.
// Destegi olmayan tarayicida sessizce atlanir; uygulama aynen calisir.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
